  #     - mysql
  #     - redis
  #   environment:
  #     - CONFIG_PATH=/app/configs/config.yaml
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./configs:/app/configs

volumes:
  mysql-data:
  redis-data:
