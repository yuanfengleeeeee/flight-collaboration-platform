core:
  port: 8081
  mode: debug
  db:
    host: 127.0.0.1
    port: 3310
    username: core_app
    password: change-me-local
    database: flight_core
    max_idle_conns: 2
    max_open_conns: 10
    conn_max_lifetime: 300
  redis:
    enabled: false
    host: 127.0.0.1
    port: 6379
    password: ""
    db: 0
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""
    client_cert_file: ""
    client_key_file: ""
    require_client_cert: false
    server_name: ""
edge:
  port: 8082
  mode: debug
  db:
    host: 127.0.0.1
    port: 3311
    username: edge_app
    password: change-me-local
    database: flight_edge
    max_idle_conns: 2
    max_open_conns: 10
    conn_max_lifetime: 300
  redis:
    enabled: false
    host: 127.0.0.1
    port: 6380
    password: ""
    db: 0
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""
    client_cert_file: ""
    client_key_file: ""
    require_client_cert: false
    server_name: ""
sync:
  edge_base_url: http://127.0.0.1:8082
  poll_interval_ms: 500
  batch_size: 20
  max_attempts: 5
  request_timeout_ms: 3000
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""
    client_cert_file: ""
    client_key_file: ""
    require_client_cert: false
    server_name: ""
jwt:
  secret: change-me-local-development-secret
  issuer: flight-core
  audience: flight-platform
log:
  level: info
  encoding: console
  output: stdout
