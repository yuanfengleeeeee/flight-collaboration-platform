core:
  port: 8081
  mode: debug
  flight_source_api_key: change-me-local-flight-source-key
  db:
    host: 127.0.0.1
    port: 3310
    username: core_app
    password: change-me
    database: flight_core
    max_idle_conns: 2
    max_open_conns: 10
    conn_max_lifetime: 300
  redis:
    enabled: false
    host: 127.0.0.1
    port: 6379
    password: ""
    db: 0
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""
    client_cert_file: ""
    client_key_file: ""
    require_client_cert: false
    server_name: ""
edge:
  port: 8082
  mode: debug
  db:
    host: 127.0.0.1
    port: 3311
    username: edge_app
    password: change-me
    database: flight_edge
    max_idle_conns: 2
    max_open_conns: 10
    conn_max_lifetime: 300
  redis:
    enabled: false
    host: 127.0.0.1
    port: 6380
    password: ""
    db: 0
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""
    client_cert_file: ""
    client_key_file: ""
    require_client_cert: false
    server_name: ""
sync:
  edge_base_url: http://127.0.0.1:8082
  poll_interval_ms: 500
  batch_size: 20
  max_attempts: 5
  request_timeout_ms: 3000
  claim_lease_seconds: 30
  assignment_receipt_timeout_seconds: 300
  # Production deployments must replace the endpoint and mapping values with
  # the contracted AODB/airline API. Secrets are resolved only from the named
  # environment variables; they are never stored in this file.
  flight_source:
    enabled: false
    provider: aodb
    base_url: ""
    schedules_path: /api/v1/flights/schedules
    events_path: /api/v1/flights/events
    from_query: from
    to_query: to
    timeout_seconds: 15
    poll_interval_seconds: 60
    lookback_minutes: 60
    lookahead_hours: 24
    user_agent: flight-collaboration-platform/flight-source
    auth:
      type: bearer
      token_env: FLIGHT_SYNC_FLIGHT_SOURCE_TOKEN
      api_key_header: X-API-Key
      username_env: FLIGHT_SYNC_FLIGHT_SOURCE_USERNAME
      password_env: FLIGHT_SYNC_FLIGHT_SOURCE_PASSWORD
    schedule_mapping:
      records_path: data.items
      external_flight_id: external_flight_id
      flight_display_no: flight_display_no
      operating_date: operating_date
      scheduled_at: scheduled_at
    event_mapping:
      records_path: data.items
      external_event_id: external_event_id
      external_flight_id: external_flight_id
      status: status
      occurred_at: occurred_at
      actual_arrival_at: actual_arrival_at
      actual_departure_at: actual_departure_at
      scheduled_at: scheduled_at
      reason: reason
      status_map: {}
    time_formats:
      - RFC3339
      - "2006-01-02 15:04:05"
    reconciliation:
      enabled: true
    alert:
      enabled: false
      webhook_url_env: FLIGHT_SYNC_FLIGHT_SOURCE_ALERT_WEBHOOK_URL
      timeout_seconds: 5
      on_sync_failure: true
      on_reconciliation_mismatch: true
    tls:
      enabled: false
      cert_file: ""
      key_file: ""
      ca_file: ""
      client_cert_file: ""
      client_key_file: ""
      require_client_cert: false
      server_name: ""
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""
    client_cert_file: ""
    client_key_file: ""
    require_client_cert: false
    server_name: ""
jwt:
  secret: change-me-local-development-secret
  issuer: flight-core
  audience: flight-platform
identity:
  core_base_url: http://127.0.0.1:8081
  internal_api_key: change-me-local-identity-key
  real_providers_enabled: false
  personal_wechat_app_id: ""
  personal_wechat_secret: ""
  wecom_corp_id: ""
  wecom_agent_id: ""
  wecom_secret: ""
  wecom_miniapp_code2session_url: ""
  access_token_ttl_seconds: 900
  session_ttl_hours: 720
  session_absolute_ttl_hours: 2160
  max_login_attempts: 5
  lockout_seconds: 900
  binding_ticket_seconds: 600
  admin_sso_enabled: false
  admin_sso_provider: "wecom"
  admin_sso_authorize_url: ""
  admin_sso_token_url: ""
  admin_sso_userinfo_url: ""
  admin_sso_client_id: ""
  admin_sso_client_secret: ""
  admin_sso_allowed_redirect_uris: ""
  admin_sso_state_ttl_seconds: 600
  admin_sso_dev_subject: ""
log:
  level: info
  encoding: console
  output: stdout
