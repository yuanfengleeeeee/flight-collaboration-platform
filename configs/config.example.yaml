# Architecture v2 example. Replace credentials through FLIGHT_* environment variables.
core:
  port: 8081
  mode: debug
  allow_dev_actor_headers: false
  flight_source_api_key: replace-in-environment
  db: {host: core-mysql, port: 3306, username: core_app, password: change-me, database: flight_core, max_idle_conns: 2, max_open_conns: 10, conn_max_lifetime: 300}
  redis: {enabled: false, host: core-redis, port: 6379, password: "", db: 0}
  tls: {enabled: false, cert_file: "", key_file: "", ca_file: "", client_cert_file: "", client_key_file: "", require_client_cert: false, server_name: ""}
edge:
  port: 8082
  mode: debug
  allow_dev_actor_headers: false
  db: {host: edge-mysql, port: 3306, username: edge_app, password: change-me, database: flight_edge, max_idle_conns: 2, max_open_conns: 10, conn_max_lifetime: 300}
  redis: {enabled: false, host: edge-redis, port: 6379, password: "", db: 0}
  tls: {enabled: false, cert_file: "", key_file: "", ca_file: "", client_cert_file: "", client_key_file: "", require_client_cert: false, server_name: ""}
sync: {edge_base_url: http://gateway, poll_interval_ms: 500, batch_size: 20, max_attempts: 5, request_timeout_ms: 3000, claim_lease_seconds: 30, assignment_receipt_timeout_seconds: 300, tls: {enabled: false, cert_file: "", key_file: "", ca_file: "", client_cert_file: "", client_key_file: "", require_client_cert: false, server_name: ""}}
jwt: {secret: change-me-local-development-secret, issuer: flight-core, audience: flight-platform}
identity: {core_base_url: http://core-api:8081, internal_api_key: replace-in-environment, real_providers_enabled: false, personal_wechat_app_id: "", personal_wechat_secret: "", wecom_corp_id: "", wecom_agent_id: "", wecom_secret: "", wecom_miniapp_code2session_url: "", access_token_ttl_seconds: 900, session_ttl_hours: 720, session_absolute_ttl_hours: 2160, max_login_attempts: 5, lockout_seconds: 900, binding_ticket_seconds: 600, admin_sso_enabled: false, admin_sso_provider: "wecom", admin_sso_authorize_url: "", admin_sso_token_url: "", admin_sso_userinfo_url: "", admin_sso_client_id: "", admin_sso_client_secret: "", admin_sso_allowed_redirect_uris: "", admin_sso_state_ttl_seconds: 600, admin_sso_dev_subject: ""}
log: {level: info, encoding: json, output: stdout}
